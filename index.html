<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AI Gallery Pro v5</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#06060a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
<style>
:root{--bg:#06060a;--surface:#0e0e14;--surface2:#16161f;--border:#1e1e2e;--accent:#8b5cf6;--accent2:#a78bfa;--green:#10b981;--red:#ef4444;--blue:#3b82f6;--orange:#f59e0b;--text:#e2e8f0;--text2:#94a3b8;--radius:14px}
[data-theme="light"]{--bg:#f8fafc;--surface:#fff;--surface2:#f1f5f9;--border:#e2e8f0;--text:#1e293b;--text2:#64748b}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
.header{position:sticky;top:0;z-index:100;background:rgba(6,6,10,.92);backdrop-filter:blur(24px);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
[data-theme="light"] .header{background:rgba(255,255,255,.92)}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#ec4899);display:flex;align-items:center;justify-content:center;font-size:18px}
.brand-name{font:bold 18px/1 system-ui;background:linear-gradient(135deg,#c4b5fd,#f9a8d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.mode-switch{display:flex;background:var(--surface);border-radius:10px;padding:3px;border:1px solid var(--border)}
.mode-btn{padding:8px 14px;border:none;border-radius:8px;background:transparent;color:var(--text2);font:600 12px/1 system-ui;cursor:pointer;transition:.25s}
.mode-btn.active{background:var(--accent);color:#fff}
.search-field{flex:1;min-width:180px;position:relative}
.search-field input{width:100%;padding:10px 14px 10px 40px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font:14px/1.4 system-ui;outline:none}
.search-field input:focus{border-color:var(--accent)}
.search-field .icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.4;pointer-events:none}
.action-group{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{padding:9px 18px;border:none;border-radius:10px;font:700 12px/1 system-ui;cursor:pointer;transition:.2s;display:flex;align-items:center;gap:5px;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,var(--accent),#7c3aed);color:#fff}
.btn-primary:disabled{opacity:.35;cursor:not-allowed}
.btn-stop{background:rgba(239,68,68,.12);color:var(--red);border:1.5px solid rgba(239,68,68,.25)}
.btn-stop.hidden{display:none}
.btn-icon{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;font-size:16px}
.settings-panel{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 20px;display:none;flex-wrap:wrap;gap:10px;align-items:center}
.settings-panel.open{display:flex}
.setting-group{display:flex;align-items:center;gap:6px}
.setting-label{font:600 11px/1 system-ui;color:var(--text2);white-space:nowrap}
.setting-select{padding:7px 10px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface2);color:var(--text);font:12px/1 system-ui;outline:none;cursor:pointer}
.status-bar{padding:7px 20px;font:11px/1.6 system-ui;color:var(--text2);text-align:center;border-bottom:1px solid var(--border);display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface)}
.status-dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-left:4px}
.dot-live{background:var(--green);box-shadow:0 0 6px var(--green)}
.dot-wait{background:var(--orange);animation:pulse 1.2s infinite}
.dot-dead{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.toolbar{padding:8px 20px;display:none;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.toolbar.visible{display:flex}
.toolbar-btn{padding:6px 14px;border:1.5px solid var(--border);border-radius:8px;background:transparent;color:var(--text2);font:600 11px/1 system-ui;cursor:pointer}
.selection-count{font:600 11px/1 system-ui;color:var(--accent);margin-right:auto}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;padding:16px 20px}
.card{position:relative;border-radius:var(--radius);overflow:hidden;background:var(--surface);border:1.5px solid var(--border);cursor:pointer;transition:.3s;aspect-ratio:1/1}
.card:hover{border-color:rgba(139,92,246,.4);transform:translateY(-3px)}
.card.selected{border-color:var(--accent);box-shadow:0 0 0 3px rgba(139,92,246,.2)}
.card img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .5s}
.card img.loaded{opacity:1}
.card-checkbox{position:absolute;top:8px;left:8px;width:24px;height:24px;border-radius:6px;border:2px solid rgba(255,255,255,.5);background:rgba(0,0,0,.4);z-index:6;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;opacity:0;transition:.2s}
.card:hover .card-checkbox,.card.selected .card-checkbox{opacity:1}
.card.selected .card-checkbox{background:var(--accent);border-color:var(--accent)}
.card-actions{position:absolute;top:8px;right:40px;display:flex;gap:4px;opacity:0;transition:.25s;z-index:5}
.card:hover .card-actions{opacity:1}
.card-btn{width:30px;height:30px;border-radius:7px;border:none;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;backdrop-filter:blur(8px)}
.card-btn-dl{background:rgba(16,185,129,.8);color:#fff}
.card-btn-fav{background:rgba(245,158,11,.8);color:#fff}
.card-btn-del{background:rgba(239,68,68,.8);color:#fff}
.card-badge{position:absolute;top:8px;right:8px;padding:3px 8px;border-radius:7px;font:700 9px/1 system-ui;backdrop-filter:blur(8px);z-index:5;pointer-events:none}
.badge-online{background:rgba(139,92,246,.8);color:#fff}
.badge-local{background:rgba(16,185,129,.8);color:#fff}
.badge-proc{background:rgba(245,158,11,.8);color:#fff}
.badge-ddg{background:rgba(59,130,246,.8);color:#fff}
.badge-upload{background:rgba(148,163,184,.8);color:#fff}
.card-label{position:absolute;bottom:0;left:0;right:0;padding:10px 12px;background:linear-gradient(transparent,rgba(0,0,0,.88));font:11px/1.5 system-ui;color:rgba(255,255,255,.85);opacity:0;transition:.25s;pointer-events:none}
.card:hover .card-label{opacity:1}
.card-loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--surface)}
.spinner{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-text{font:10px/1.4 system-ui;color:var(--text2);text-align:center;padding:0 12px}
.card-error{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:var(--surface);color:var(--red);font:11px/1.4 system-ui;text-align:center;padding:20px}
.retry-btn{padding:6px 16px;border:1.5px solid var(--border);border-radius:8px;background:transparent;color:var(--text2);font:600 11px/1 system-ui;cursor:pointer}
.load-more-wrap{text-align:center;padding:8px 20px 24px}
.load-more{padding:12px 36px;border:1.5px solid var(--border);border-radius:12px;background:transparent;color:var(--text2);font:600 13px/1 system-ui;cursor:pointer;display:none}
.modal-overlay{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.92);backdrop-filter:blur(16px);display:none;align-items:center;justify-content:center;flex-direction:column;padding:20px}
.modal-overlay.open{display:flex}
.modal-img{max-width:92vw;max-height:70vh;border-radius:16px;object-fit:contain}
.modal-meta{margin-top:14px;text-align:center;max-width:90vw}
.modal-quality{display:inline-flex;padding:8px 20px;border-radius:10px;background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.25);color:var(--accent2);font:700 13px/1 system-ui;margin-bottom:8px}
.modal-desc{font:12px/1.7 system-ui;color:var(--text2);white-space:pre-line;max-width:600px;margin:0 auto}
.modal-close{position:absolute;top:20px;left:20px;width:42px;height:42px;border-radius:50%;border:none;background:rgba(255,255,255,.06);color:#fff;font-size:20px;cursor:pointer}
.modal-download{margin-top:12px;padding:12px 32px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--green),#059669);color:#fff;font:700 14px/1 system-ui;cursor:pointer}
.toast-container{position:fixed;bottom:20px;left:20px;z-index:400;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 20px;border-radius:10px;font:600 12px/1.4 system-ui;color:#fff;animation:tin .3s ease;max-width:320px}
.toast-success{background:rgba(16,185,129,.9)}.toast-error{background:rgba(239,68,68,.9)}.toast-info{background:rgba(139,92,246,.9)}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:640px){.gallery{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;padding:10px 12px}.mode-btn{padding:7px 10px;font-size:11px}}
</style>
</head>
<body>

<div class="header">
  <div class="brand"><div class="brand-icon">🧠</div><div class="brand-name">AI Gallery Pro v5</div></div>
  <div class="mode-switch">
    <button class="mode-btn active" data-mode="ai" onclick="setMode('ai')">✨ AI</button>
    <button class="mode-btn" data-mode="ddg" onclick="setMode('ddg')">🔍 جستجو</button>
    <button class="mode-btn" data-mode="history" onclick="setMode('history')">📜 تاریخچه</button>
    <button class="mode-btn" data-mode="favorites" onclick="setMode('favorites')">⭐ علاقه‌مندی</button>
  </div>
  <div class="search-field"><span class="icon">✏️</span><input id="promptInput" type="text" placeholder="هر چیزی بنویسید: ایران، گل، گربه فضانورد..." autocomplete="off"></div>
  <div class="action-group">
    <button class="btn btn-primary" id="genBtn" onclick="act()">✨ بساز</button>
    <button class="btn btn-stop hidden" id="stopBtn" onclick="stopAll()">⏹ توقف</button>
    <button class="btn-icon" onclick="$('settingsPanel').classList.toggle('open')">⚙️</button>
    <button class="btn-icon" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
</div>

<div class="settings-panel" id="settingsPanel">
  <div class="setting-group"><span class="setting-label">موتور:</span>
    <select class="setting-select" id="engineSelect">
      <option value="auto">خودکار (هوشمند)</option>
      <option value="local">🧠 داخلی — بدون فیلترشکن</option>
      <option value="online">🌐 آنلاین (۱۲ پروکسی)</option>
      <option value="proc">🎨 آفلاین GPU (تضمینی)</option>
    </select>
  </div>
  <div class="setting-group"><span class="setting-label">مدل داخلی:</span>
    <select class="setting-select" id="localModelSelect">
      <option value="Xenova/sd-v1-5-onnx">SD v1.5 ONNX (پایدار)</option>
      <option value="Xenova/stable-diffusion-tiny">Tiny (سریع/کم‌حجم)</option>
    </select>
  </div>
  <div class="setting-group"><span class="setting-label">اندازه آنلاین:</span>
    <select class="setting-select" id="sizeSelect">
      <option value="1024x1024">1024×1024</option>
      <option value="1280x720">1280×720</option>
      <option value="720x1280">720×1280</option>
    </select>
  </div>
  <div class="setting-group"><span class="setting-label">تعداد:</span>
    <select class="setting-select" id="countSelect">
      <option value="1">1</option><option value="2">2</option><option value="4" selected>4</option><option value="6">6</option><option value="8">8</option>
    </select>
  </div>
</div>

<div class="toolbar" id="toolbar">
  <span class="selection-count" id="selCount"></span>
  <button class="toolbar-btn" onclick="selectAll()">☑ انتخاب همه</button>
  <button class="toolbar-btn" onclick="deselectAll()">☐ حذف انتخاب</button>
  <button class="toolbar-btn" onclick="downloadSelected()">💾 دانلود</button>
  <button class="toolbar-btn" onclick="deleteSelected()">🗑 حذف</button>
</div>

<div class="status-bar">
  <span><span class="status-dot dot-wait" id="netDot"></span> <span id="netStatus">بررسی شبکه...</span></span>
  <span><span class="status-dot dot-wait" id="localDot"></span> <span id="localStatus">AI داخلی: آماده</span></span>
  <span id="countLabel">آماده</span>
</div>

<div class="gallery" id="gallery"></div>
<div class="load-more-wrap"><button class="load-more" id="loadMoreBtn" onclick="act()">بیشتر...</button></div>

<div class="modal-overlay" id="modal">
  <button class="modal-close" onclick="closeModal()">✕</button>
  <img class="modal-img" id="modalImg" alt="">
  <div class="modal-meta"><div class="modal-quality" id="modalQuality"></div><div class="modal-desc" id="modalDesc"></div></div>
  <button class="modal-download" onclick="downloadModal()">💾 دانلود تصویر</button>
</div>
<div class="toast-container" id="toastContainer"></div>

<!-- ═══ ENHANCED PROCEDURAL SHADER v5 ═══ -->
<script id="vs" type="x-shader/x-vertex">attribute vec2 pos;void main(){gl_Position=vec4(pos,0.,1.);}</script>
<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 u_res;uniform float u_time;uniform vec2 u_mouse;uniform int u_sc;uniform float u_sd;

float hash(vec3 p){p=fract(p*.3183099+.1);p*=17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float noise(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fbm(vec3 p){float v=0.,a=.5;for(int i=0;i<6;i++){v+=a*noise(p);p*=2.03;a*=.48;}return v;}
float smin(float a,float b,float k){float h=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,h)-k*h*(1.-h);}
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}

// Scene 0: Neon Cyber Garden
float mCyber(vec3 p,out vec3 c){
    float d=1e10;c=vec3(.1,.9,.8);
    float grid=abs(fract(p.x*.5)-.5)+abs(fract(p.z*.5)-.5);
    float floor=smin(p.y+1.5,grid-.45,.1);
    if(floor<d){d=floor;c=vec3(.05,.2,.3)+vec3(.1,.8,.7)*smoothstep(.45,.0,grid);}
    for(int i=0;i<7;i++){
        float fi=float(i);
        vec3 tp=p-vec3(sin(fi*1.7+u_sd)*2.,fi*.4-1.,cos(fi*2.1+u_sd)*2.);
        tp.xz*=rot(u_time*.3+fi);
        float stem=smin(d,length(tp.xz)-.03-abs(tp.y)*.01,.05);
        if(stem<d){d=stem;c=vec3(.2,.6,.3);}
        float petal=length(tp)-.25-fbm(tp*5.+u_time)*.08;
        if(petal<d){d=petal;c=mix(vec3(.9,.1,.6),vec3(.3,.1,.9),sin(fi+u_time)*.5+.5);}
    }
    return d;
}

// Scene 1: Animated Mountains
float mMount(vec3 p,out vec3 c){
    float h=fbm(p*.25+u_sd+u_time*.02)*3.+fbm(p*.7+u_sd*2.)*1.2;
    float g=p.y-h+1.2;
    c=mix(vec3(.22,.18,.12),vec3(.38,.32,.25),smoothstep(-1.5,1.,h));
    c=mix(c,vec3(.95,.97,1.),smoothstep(1.8,2.5,h));
    return g;
}

// Scene 2: Rotating Planet
float mPlanet(vec3 p,out vec3 c){
    vec3 sp=p;sp.xz*=rot(u_time*.05);
    float pl=length(sp)-1.5;
    float n=fbm(sp*2.5+u_sd);
    c=mix(vec3(.08,.15,.45),vec3(.15,.45,.12),smoothstep(.3,.65,n));
    c=mix(c,vec3(.85,.9,.95),smoothstep(.72,.82,n));
    c+=vec3(.3,.4,.8)*exp(-max(pl,0.)*4.)*.6;
    float rg=length(vec2(length(p.xz)-2.3,p.y))-.12;
    rg=max(rg,abs(p.y)-.015);
    if(rg<pl){c=vec3(.65,.55,.45)*(.4+.6*noise(p*10.));return rg;}
    return pl;
}

// Scene 3: Ocean Waves
float mOcean(vec3 p,out vec3 c){
    float w=sin(p.x*1.8+u_time)*cos(p.z*1.3+u_time*.6)*.18+sin(p.x*4.5-u_time*1.2)*.06;
    float s=p.y-w;
    c=mix(vec3(.0,.12,.3),vec3(.0,.35,.55),smoothstep(-.4,.4,w));
    c=mix(c,vec3(.88,.92,.98),smoothstep(.14,.18,w));
    return s;
}

// Scene 4: Fire
float mFire(vec3 p,out vec3 c){
    float f=length(p-vec3(0,-.4,0))-.55+fbm(p*3.+vec3(0,u_time*4.,0)+u_sd)*.5-.15;
    float gl=exp(-max(f,0.)*2.5);
    c=mix(vec3(1.,.05,0.),vec3(1.,.7,.05),gl);
    c+=vec3(1.,.3,.0)*exp(-max(f,0.)*6.)*.8;
    return f;
}

// Scene 5: Crystal
float mCrystal(vec3 p,out vec3 c){
    float d=1e10;c=vec3(.4,.6,1.);
    for(int i=0;i<9;i++){
        float fi=float(i);vec3 cp=p;
        cp.xz*=rot(fi*1.2+u_sd+u_time*.1);
        cp-=vec3(sin(fi*2.3)*.55,fi*.22-.9,cos(fi*2.3)*.55);
        float bl=smin(d,length(cp)-.06-.35-fi*.12,.05);
        if(bl<d){d=bl;c=.5+.5*cos(vec3(1.,1.15,1.4)*fi*1.3);}
    }
    return d;
}

// Scene 6: Tree
float mTree(vec3 p,out vec3 c){
    vec3 tp=p;tp.x+=sin(p.y*.5)*.1;
    float tr=length(tp.xz)-.1+abs(tp.y+2.5)*.02;
    tr=max(tr,tp.y-.6);tr=max(tr,-tp.y-2.5);
    c=vec3(.32,.18,.08);
    float fol=1e10;
    for(int i=0;i<5;i++){
        float fi=float(i);
        fol=smin(fol,length(p-vec3(sin(fi*1.8)*.6,.8+fi*.35,cos(fi*1.8)*.6))-.55-noise(p*3.+u_sd)*.2,.15);
    }
    if(fol<tr){tr=fol;c=vec3(.08,.38,.12)+fbm(p*4.+u_sd)*.12;}
    return tr;
}

// Scene 7: Nebula
float mNebula(vec3 p,out vec3 c){
    float n=fbm(p*.4+u_sd+u_time*.03);
    float n2=fbm(p*1.1+vec3(5.));
    float n3=fbm(p*2.5+vec3(10.)+u_sd*2.);
    c=vec3(.5,.08,.25)*smoothstep(.25,.75,n)*.9+vec3(.08,.15,.6)*smoothstep(.35,.85,n2)*.7+vec3(.85,.6,.15)*smoothstep(.65,.92,n*n2)*1.8;
    return -(n*.4+n2*.3+n3*.15);
}

// Scene 8: Ice
float mIce(vec3 p,out vec3 c){
    float d=1e10;c=vec3(.7,.85,1.);
    for(int i=0;i<11;i++){
        float fi=float(i);vec3 ip=p;
        ip.xz*=rot(fi*1.6+u_sd);
        ip-=vec3(sin(fi*2.4)*.75,-1.1+fi*.28,cos(fi*2.4)*.75);
        float bl=smin(d,length(ip.xz)-.12-abs(ip.y+.5+fi*.14)*.3,.035);
        if(bl<d){d=bl;c=vec3(.68,.86,.98);}
    }
    float g=p.y+1.6;if(g<d){d=g;c=vec3(.58,.72,.88);}
    return d;
}

float map(vec3 p,out vec3 mc){
    if(u_sc==0)return mCyber(p,mc);
    if(u_sc==1)return mMount(p,mc);
    if(u_sc==2)return mPlanet(p,mc);
    if(u_sc==3)return mOcean(p,mc);
    if(u_sc==4)return mFire(p,mc);
    if(u_sc==5)return mCrystal(p,mc);
    if(u_sc==6)return mTree(p,mc);
    if(u_sc==7)return mNebula(p,mc);
    if(u_sc==8)return mIce(p,mc);
    mc=vec3(.5);return length(p)-1.;
}

vec3 norm(vec3 p){vec3 mc;vec2 e=vec2(.001,0.);return normalize(vec3(map(p+e.xyy,mc)-map(p-e.xyy,mc),map(p+e.yxy,mc)-map(p-e.yxy,mc),map(p+e.yyx,mc)-map(p-e.yyx,mc)));}

void main(){
    vec2 uv=(gl_FragCoord.xy-.5*u_res)/u_res.y;
    float mx=u_mouse.x*6.28318,my=clamp(u_mouse.y*2.-.5,-.8,.8);
    vec3 ro=vec3(sin(mx)*4.2,my*3.+1.5,cos(mx)*4.2);
    vec3 ww=normalize(-ro);vec3 uu=normalize(cross(ww,vec3(0.,1.,0.)));vec3 vv=cross(uu,ww);
    vec3 rd=normalize(uv.x*uu+uv.y*vv+2.*ww);
    
    float t=0.;vec3 col=vec3(.004,.004,.012);bool hit=false;vec3 mc=vec3(.5);
    for(int i=0;i<120;i++){
        vec3 p=ro+rd*t;float d=map(p,mc);
        if(d<.001){hit=true;break;}
        if(t>25.)break;t+=d*.75;
    }
    
    if(hit){
        vec3 p=ro+rd*t;vec3 n=norm(p);
        vec3 l=normalize(vec3(3.,5.5,3.));vec3 v=normalize(-rd);vec3 h=normalize(l+v);
        col=mc*.08+mc*max(dot(n,l),0.)*.8+vec3(1.)*pow(max(dot(n,h),0.),48.)*.4+mc*pow(1.-max(dot(n,v),0.),4.)*.3;
        col=mix(col,vec3(.004,.004,.012),1.-exp(-t*.06));
    }
    col=col/(col+1.);col=pow(col,vec3(.4545));
    vec2 q=gl_FragCoord.xy/u_res;col*=.5+.5*pow(16.*q.x*q.y*(1.-q.x)*(1.-q.y),.1);
    gl_FragColor=vec4(col,1.);
}
</script>

<script>
// ═══════════════════════════════════════════════
// CONFIG & STATE
// ═══════════════════════════════════════════════
const CONFIG={MAX_CONCURRENT:3,TIMEOUT_MS:45000,DB_NAME:'AIGalleryDB_v5',DB_VERSION:2,MAX_HISTORY:500};
const state={mode:'ai',items:[],allItems:[],favorites:new Set(),selected:new Set(),loading:false,abortController:null,queue:[],activeTasks:0,total:0,theme:localStorage.getItem('ag-theme')||'dark'};
const $=id=>document.getElementById(id);
const gallery=$('gallery'),promptInput=$('promptInput'),genBtn=$('genBtn'),stopBtn=$('stopBtn'),countLabel=$('countLabel'),loadMoreBtn=$('loadMoreBtn'),modal=$('modal');

// Register Service Worker

function toast(msg,type='info'){const el=document.createElement('div');el.className=`toast toast-${type}`;el.textContent=msg;$('toastContainer').appendChild(el);setTimeout(()=>{el.style.opacity='0';setTimeout(()=>el.remove(),300);},3500);}

function revokeBlob(u){if(u&&typeof u==='string'&&u.startsWith('blob:')){try{URL.revokeObjectURL(u);}catch(e){}}}
function escapeHtml(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}

// ═══════════════════════════════════════════════
// INDEXEDDB CACHE WITH LRU EVICTION
// ═══════════════════════════════════════════════
const cache={db:null,
  init(){return new Promise(res=>{try{const r=indexedDB.open(CONFIG.DB_NAME,CONFIG.DB_VERSION);r.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains('images'))db.createObjectStore('images',{keyPath:'url'});if(!db.objectStoreNames.contains('meta'))db.createObjectStore('meta',{keyPath:'key'});};r.onsuccess=e=>{cache.db=e.target.result;res();};r.onerror=()=>res();}catch(e){res();}});},
  async get(url){if(!cache.db)return null;return new Promise(r=>{try{const tx=cache.db.transaction('images','readonly');const q=tx.objectStore('images').get(url);q.onsuccess=()=>r(q.result?.blob||null);q.onerror=()=>r(null);}catch(e){r(null);}});},
  async set(url,blob){if(!cache.db||!blob)return;
    // LRU Eviction: Check storage quota
    try{
      if(navigator.storage&&navigator.storage.estimate){
        const est=await navigator.storage.estimate();
        if(est.usage/est.quota>0.8){
          const tx=cache.db.transaction('images','readwrite');
          const store=tx.objectStore('images');
          const req=store.getAllKeys();
          req.onsuccess=()=>{
            const keys=req.result;
            if(keys.length>10){for(let i=0;i<Math.min(5,keys.length);i++)store.delete(keys[i]);}
          };
        }
      }
    }catch(e){}
    try{const tx=cache.db.transaction('images','readwrite');tx.objectStore('images').put({url,blob,ts:Date.now()});}catch(e){}},
  saveMeta(k,v){if(!cache.db)return;try{const tx=cache.db.transaction('meta','readwrite');tx.objectStore('meta').put({key:k,value:v});}catch(e){}},
  getMeta(k){if(!cache.db)return Promise.resolve(null);return new Promise(r=>{try{const tx=cache.db.transaction('meta','readonly');const q=tx.objectStore('meta').get(k);q.onsuccess=()=>r(q.result?.value||null);q.onerror=()=>r(null);}catch(e){r(null);}});}
};

// ═══════════════════════════════════════════════
// QUEUE SYSTEM
// ═══════════════════════════════════════════════
function enqueue(fn){return new Promise((res,rej)=>{state.queue.push({fn,res,rej});processQueue();});}
async function processQueue(){while(state.activeTasks<CONFIG.MAX_CONCURRENT&&state.queue.length>0){const t=state.queue.shift();state.activeTasks++;try{t.res(await t.fn());}catch(e){t.rej(e);}finally{state.activeTasks--;processQueue();}}}

// ═══════════════════════════════════════════════
// ENGINE 1: ONLINE (12 PROXIES + POLLINATIONS)
// ═══════════════════════════════════════════════
const PROXIES=[
  u=>`https://image.pollinations.ai/prompt/${encodeURIComponent(u)}?nologo=true&model=flux`,
  u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u=>`https://corsproxy.io/?${encodeURIComponent(u)}`,
  u=>`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
  u=>`https://cors-anywhere.herokuapp.com/${u}`,
  u=>`https://thingproxy.freeboard.io/fetch/${u}`,
  u=>`https://cors.eu.org/${u}`,
  u=>`https://yacdn.org/proxy/${u}`,
  u=>`https://proxy.cors.sh/${u}`,
  u=>`https://cors.bridged.cc/${u}`,
  u=>`https://api.allorigins.win/get?url=${encodeURIComponent(u)}`,
  u=>`https://noreferrer.com/?${u}`
];

async function genOnline(prompt,w,h,seed,model,signal){
  const basePrompt=prompt+', highly detailed, professional photography, beautiful lighting, 8k';
  const baseUrl=`https://image.pollinations.ai/prompt/${encodeURIComponent(basePrompt)}?width=${w}&height=${h}&seed=${seed}&nologo=true&model=${model}`;
  
  for(const proxy of PROXIES){
    if(signal.aborted)throw new DOMException('Aborted','AbortError');
    const url=proxy(baseUrl);
    const cached=await cache.get(url);
    if(cached&&cached.size>800)return{blob:cached,key:url,engine:'online'};
    
    const ctrl=new AbortController();
    const timer=setTimeout(()=>ctrl.abort(),CONFIG.TIMEOUT_MS);
    const onAbort=()=>ctrl.abort();
    signal.addEventListener('abort',onAbort);
    
    try{
      const res=await fetch(url,{signal:ctrl.signal});
      clearTimeout(timer);
      if(!res.ok)throw new Error('HTTP '+res.status);
      const blob=await res.blob();
      if(blob.size<800||!blob.type.startsWith('image'))throw new Error('bad payload');
      cache.set(url,blob);
      return{blob,key:url,engine:'online'};
    }catch(e){
      clearTimeout(timer);
      if(signal.aborted)throw new DOMException('Aborted','AbortError');
      continue;
    }finally{signal.removeEventListener('abort',onAbort);}
  }
  throw new Error('تمام ۱۲ پروکسی ناموفق بودند');
}

// ═══════════════════════════════════════════════
// ENGINE 2: LOCAL AI (Transformers.js)
// ═══════════════════════════════════════════════
let tfPromise=null;
function loadTF(){
  if(!tfPromise){
    tfPromise=(async()=>{
      const cdns=['https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.2','https://unpkg.com/@huggingface/transformers@3.5.2'];
      for(const c of cdns){try{return await import(c);}catch(e){continue;}}
      throw new Error('CDN blocked');
    })();
  }
  return tfPromise;
}
async function ensureLocal(onProg){
  if(localPipe)return localPipe;
  $('localDot').className='status-dot dot-wait';
  $('localStatus').textContent='AI داخلی: دانلود کتابخانه...';
  const tf=await loadTF();
  const hasGPU=!!navigator.gpu;
  const model=$('localModelSelect').value;
  $('localStatus').textContent='AI داخلی: دانلود مدل (یکبار)...';
  localPipe=await tf.pipeline('text-to-image',model,{
    device:hasGPU?'webgpu':'wasm',
    dtype:hasGPU?'fp16':'q8',
    progress_callback:p=>{if(p.status==='progress'&&p.progress!=null)onProg&&onProg(`دانلود مدل: ${Math.round(p.progress)}%`);}
  });
  localDevice=hasGPU?'webgpu':'wasm';
  $('localDot').className='status-dot dot-live';
  $('localStatus').textContent=`AI داخلی: ✅ آماده (${localDevice})`;
  return localPipe;
}
async function genLocal(prompt,seed,onProg,signal){
  const pipe=await ensureLocal(onProg);
  onProg&&onProg('در حال تولید با AI داخلی...');
  const out=await pipe(prompt,{width:512,height:512,num_inference_steps:localDevice==='webgpu'?4:2});
  if(signal.aborted)throw new DOMException('Aborted','AbortError');
  const c=document.createElement('canvas');c.width=out.width;c.height=out.height;
  c.getContext('2d').putImageData(new ImageData(out.data,out.width,out.height),0,0);
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));
  if(!blob)throw new Error('blob fail');
  const key=`local:${seed}:${prompt.slice(0,80)}`;
  cache.set(key,blob);
  return{blob,key,engine:'local',width:out.width,height:out.height};
}

// ═══════════════════════════════════════════════
// ENGINE 3: PROCEDURAL GPU
// ═══════════════════════════════════════════════
const KW={0:['گل','flower','رز','rose','لاله','tulip','شکوفه','blossom','باغ','garden','سایبر','cyber','نئون','neon'],1:['کوه','mountain','قله','peak','دماوند','صخره','rock','برف','snow'],2:['سیاره','planet','فضا','space','ماه','moon','زمین','earth'],3:['دریا','sea','اقیانوس','ocean','موج','wave','آب','water','ایران','iran'],4:['آتش','fire','شعله','flame','آتشفشان','volcano'],5:['کریستال','crystal','الماس','diamond','جواهر','gem'],6:['درخت','tree','جنگل','forest','طبیعت','nature'],7:['کهکشان','galaxy','سحابی','nebula','ستاره','star','فضای','cosmic'],8:['یخ','ice','زمستان','winter','یخبندان','frost']};
function pickScene(text){
  const t=(text||'').toLowerCase();
  for(const[sc,words]of Object.entries(KW))for(const w of words)if(t.includes(w))return+sc;
  let h=Date.now();for(let i=0;i<t.length;i++)h=((h<<5)-h+t.charCodeAt(i))|0;
  return Math.abs(h)%9;
}
function genProc(prompt,seed){
  return new Promise((resolve,reject)=>{
    try{
      const scene=pickScene(prompt);
      const W=640,H=640;
      const cv=document.createElement('canvas');cv.width=W;cv.height=H;
      const gl=cv.getContext('webgl',{preserveDrawingBuffer:true});
      if(!gl)return reject(new Error('no webgl'));
      
      cv.addEventListener('webglcontextlost',(e)=>{e.preventDefault();reject(new Error('WebGL context lost'));},false);
      
      function mk(t,src){const s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}
      const pg=gl.createProgram();
      gl.attachShader(pg,mk(gl.VERTEX_SHADER,$('vs').textContent));
      gl.attachShader(pg,mk(gl.FRAGMENT_SHADER,$('fs').textContent));
      gl.linkProgram(pg);gl.useProgram(pg);
      const bf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,bf);
      gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
      const pl=gl.getAttribLocation(pg,'pos');gl.enableVertexAttribArray(pl);gl.vertexAttribPointer(pl,2,gl.FLOAT,false,0,0);
      gl.viewport(0,0,W,H);
      gl.uniform2f(gl.getUniformLocation(pg,'u_res'),W,H);
      gl.uniform1f(gl.getUniformLocation(pg,'u_time'),performance.now()/1000);
      gl.uniform2f(gl.getUniformLocation(pg,'u_mouse'),.3+(seed%40)/100,.4+((seed>>2)%40)/100);
      gl.uniform1i(gl.getUniformLocation(pg,'u_sc'),scene);
      gl.uniform1f(gl.getUniformLocation(pg,'u_sd'),seed%1000);
      gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
      cv.toBlob(b=>{
        try{gl.getExtension('WEBGL_lose_context')?.loseContext();}catch(e){}
        if(!b)return reject(new Error('blob fail'));
        const key=`proc:${scene}:${seed}`;
        cache.set(key,b);
        resolve({blob:b,key,engine:'proc',width:W,height:H,scene});
      },'image/png');
    }catch(e){reject(e);}
  });
}

// ═══════════════════════════════════════════════
// ORCHESTRATOR
// ═══════════════════════════════════════════════
async function generateImage(prompt,w,h,seed,signal,onProg){
  const mode=$('engineSelect').value;
  const order=mode==='auto'
    ?(navigator.onLine?['online','local','proc']:['local','proc'])
    :[mode];
  let lastErr=null;
  for(const eng of order){
    if(signal.aborted)throw new DOMException('Aborted','AbortError');
    try{
      if(eng==='online')return await genOnline(prompt,w,h,seed,'flux',signal);
      if(eng==='local')return await genLocal(prompt,seed,onProg,signal);
      if(eng==='proc')return await genProc(prompt,seed);
    }catch(e){
      if(e.name==='AbortError')throw e;
      lastErr=e;
      onProg&&onProg(`موتور ${eng==='online'?'آنلاین':eng==='local'?'داخلی':'آفلاین'} ناموفق → بعدی...`);
    }
  }
  throw lastErr||new Error('تمام موتورها ناموفق بودند');
}

// ═══════════════════════════════════════════════
// MODES & ACTIONS
// ═══════════════════════════════════════════════
window.setMode=function(mode){
  if(state.loading){toast('صبر کنید تا تمام شود','info');return;}
  state.mode=mode;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
  if(mode==='ai'){genBtn.innerHTML='✨ بساز';promptInput.disabled=false;renderGallery(state.allItems);}
  else if(mode==='ddg'){genBtn.innerHTML='🔍 جستجو';promptInput.disabled=false;renderGallery([]);}
  else if(mode==='history'){genBtn.innerHTML='🔄 پاکسازی';promptInput.disabled=true;renderGallery(state.allItems);}
  else{genBtn.innerHTML='⭐';promptInput.disabled=true;renderGallery(state.allItems.filter(i=>state.favorites.has(i.id)));}
};
promptInput.addEventListener('keypress',e=>{if(e.key==='Enter')act();});

window.act=async function(){
  if(state.loading)return;
  const q=promptInput.value.trim();
  if(state.mode==='ai'){if(!q){promptInput.focus();return;}await startGeneration(q);}
  else if(state.mode==='ddg'){if(!q){promptInput.focus();return;}await searchDDG(q);}
  else if(state.mode==='history'){if(confirm('تاریخچه پاک شود؟')){state.allItems=[];cache.saveMeta('history',[]);renderGallery([]);toast('پاک شد','info');}}
};

window.stopAll=function(){
  if(state.abortController)state.abortController.abort();
  state.abortController=null;state.queue=[];state.activeTasks=0;state.loading=false;
  updateUI(false);setStatus('⏹ متوقف شد');toast('متوقف شد','info');
};

function updateUI(l){state.loading=l;genBtn.disabled=l;stopBtn.classList.toggle('hidden',!l);loadMoreBtn.style.display=(state.items.length>0&&!l)?'inline-block':'none';updateToolbar();}
function updateToolbar(){$('toolbar').classList.toggle('visible',state.items.length>0);$('selCount').textContent=state.selected.size>0?`${state.selected.size} انتخاب`:'';}

// ═══════════════════════════════════════════════
// GENERATION
// ═══════════════════════════════════════════════
async function startGeneration(rawPrompt){
  const count=parseInt($('countSelect').value,10);
  const[w,h]=$('sizeSelect').value.split('x').map(Number);
  state.abortController=new AbortController();
  const signal=state.abortController.signal;
  updateUI(true);
  setStatus(`⏳ تولید ${count} تصویر...`);
  let done=0,errs=0;
  const promises=[];
  for(let i=0;i<count;i++){
    if(signal.aborted)break;
    const seed=Math.floor(Math.random()*99999999);
    const id=`ai-${Date.now()}-${i}-${seed}`;
    createLoadingCard(id,rawPrompt,'ai');
    const loadTextEl=()=>{const c=$(id);return c?c.querySelector('.load-text'):null;};
    const p=enqueue(()=>generateImage(rawPrompt,w,h,seed,signal,msg=>{const el=loadTextEl();if(el)el.textContent=msg;}))
      .then(result=>{
        if(signal.aborted)return;
        const item={id,cacheKey:result.key,label:rawPrompt,type:'ai',engine:result.engine,seed,
          width:result.width||w,height:result.height||h,timestamp:Date.now(),prompt:rawPrompt};
        blobToItem(item,result.blob);
        state.allItems.unshift(item);
        if(state.allItems.length>CONFIG.MAX_HISTORY)state.allItems.pop();
        cache.saveMeta('history',state.allItems);
        done++;state.total++;
        setStatus(`✅ ${done}/${count} · ${engineName(result.engine)}`);
      })
      .catch(e=>{
        if(signal.aborted||e.name==='AbortError')return;
        showCardError(id,rawPrompt,'ai',seed);errs++;
        setStatus(`⚠️ ${done+errs}/${count}`);
      });
    promises.push(p);
  }
  await Promise.allSettled(promises);
  if(!signal.aborted){
    setStatus(`✅ ${done} آماده · ${errs} خطا · مجموع: ${state.total}`);
    if(done>0)toast(`${done} تصویر تولید شد`,'success');
    else toast('هیچ موتوری جواب نداد. حالت «🎨 آفلاین GPU» را انتخاب کنید.','error');
  }
  updateUI(false);state.abortController=null;
}
function engineName(e){return e==='online'?'🌐 آنلاین':e==='local'?'🧠 AI داخلی':'🎨 آفلاین GPU';}

// ═══════════════════════════════════════════════
// DDG SEARCH WITH FALLBACK
// ═══════════════════════════════════════════════
async function searchDDG(query){
  state.abortController=new AbortController();
  const signal=state.abortController.signal;
  updateUI(true);setStatus(`🔍 "${query}"...`);
  try{
    const ddg=`https://duckduckgo.com/?q=${encodeURIComponent(query)}&iax=images&ia=images`;
    let html='';
    for(const px of[`https://api.allorigins.win/raw?url=${encodeURIComponent(ddg)}`,`https://corsproxy.io/?${encodeURIComponent(ddg)}`]){
      try{const r=await fetch(px,{signal:AbortSignal.timeout(8000)});if(r.ok){html=await r.text();break;}}catch(e){continue;}
    }
    const urls=[];
    for(const m of html.matchAll(/"image"\s*:\s*"(https?:\/\/[^"]+)"/g)){urls.push(m[1].replace(/\\/g,''));if(urls.length>=16)break;}
    if(urls.length===0){
      toast('جستجوی وب ناموفق → تولید با AI','info');
      await startGeneration(query);
      return;
    }
    let loaded=0;
    await Promise.allSettled(urls.map((src,i)=>{
      const id=`ddg-${Date.now()}-${i}`;
      createLoadingCard(id,`${query} #${i+1}`,'ddg');
      return enqueue(async()=>{
        const cached=await cache.get(src);
        if(cached)return{blob:cached,key:src};
        const r=await fetch(src,{signal});
        if(!r.ok)throw new Error('http');
        const b=await r.blob();cache.set(src,b);return{blob:b,key:src};
      }).then(({blob,key})=>{
        const item={id,cacheKey:key,label:`${query} #${i+1}`,type:'ddg',engine:'online',seed:0,width:0,height:0,timestamp:Date.now(),prompt:query};
        blobToItem(item,blob);loaded++;setStatus(`🔍 ${loaded}/${urls.length}`);
      }).catch(()=>showCardError(id,query,'ddg',0));
    }));
    setStatus(`✅ ${loaded} نتیجه`);
  }catch(e){if(!signal.aborted)setStatus('❌ '+e.message);}
  updateUI(false);state.abortController=null;
}

// ═══════════════════════════════════════════════
// CARDS
// ═══════════════════════════════════════════════
function badgeFor(item){
  if(item.type==='ddg')return['badge-ddg','🔍 وب'];
  if(item.type==='upload')return['badge-upload','📁'];
  if(item.engine==='local')return['badge-local','🧠 داخلی'];
  if(item.engine==='proc')return['badge-proc','🎨 آفلاین'];
  return['badge-online','✨ AI'];
}
function createLoadingCard(id,label,type){
  const card=document.createElement('div');card.className='card';card.id=id;
  const[bc,bt]=type==='ddg'?['badge-ddg','🔍 وب']:['badge-online','✨ AI'];
  card.innerHTML=`<div class="card-loading"><div class="spinner"></div><div class="load-text">در حال تولید...</div></div><div class="card-badge ${bc}">${bt}</div><div class="card-label">${escapeHtml(label)}</div>`;
  gallery.prepend(card);
}
function blobToItem(item,blob){
  revokeBlob(item.src);
  item.src=URL.createObjectURL(blob);
  item.blob=blob;
  replaceCardWithImage(item);
}
function replaceCardWithImage(item){
  const card=$(item.id);if(!card)return;
  const old=state.items.findIndex(i=>i.id===item.id);
  if(old>=0)state.items.splice(old,1);
  state.items.unshift(item);
  const[bc,bt]=badgeFor(item);
  const isFav=state.favorites.has(item.id);
  card.innerHTML='';
  const img=document.createElement('img');
  img.src=item.src;img.loading='lazy';img.alt=item.label;
  img.onload=()=>img.classList.add('loaded');
  img.onerror=()=>showCardError(item.id,item.label,item.type,item.seed);
  card.appendChild(img);
  card.insertAdjacentHTML('beforeend',`
    <div class="card-checkbox" onclick="event.stopPropagation();toggleSelect('${item.id}')">${state.selected.has(item.id)?'✓':''}</div>
    <div class="card-actions">
      <button class="card-btn card-btn-dl" onclick="event.stopPropagation();quickDownload('${item.id}')">💾</button>
      <button class="card-btn card-btn-fav" onclick="event.stopPropagation();toggleFav('${item.id}')">${isFav?'★':'☆'}</button>
      <button class="card-btn card-btn-del" onclick="event.stopPropagation();deleteItem('${item.id}')">🗑</button>
    </div>
    <div class="card-badge ${bc}">${bt}</div>
    <div class="card-label">${escapeHtml(item.label)}</div>`);
  card.onclick=()=>openModal(item);
  if(state.selected.has(item.id))card.classList.add('selected');
  updateToolbar();
}
function showCardError(id,label,type,seed){
  const card=$(id);if(!card)return;
  card.innerHTML=`<div class="card-error"><span>❌ ناموفق</span><button class="retry-btn" onclick="event.stopPropagation();retryCard('${id}','${escapeHtml(label).replace(/'/g,"\\'")}','${type}',${seed||0})">🔄 تلاش مجدد</button></div><div class="card-label">${escapeHtml(label)}</div>`;
}
window.retryCard=function(id,label,type,seed){
  const card=$(id);if(!card)return;
  card.innerHTML=`<div class="card-loading"><div class="spinner"></div><div class="load-text">تلاش مجدد...</div></div><div class="card-label">${escapeHtml(label)}</div>`;
  const signal=new AbortController().signal;
  enqueue(()=>generateImage(label,1024,1024,seed||Math.floor(Math.random()*9999999),signal,msg=>{const el=card.querySelector('.load-text');if(el)el.textContent=msg;}))
    .then(result=>{
      const item={id,cacheKey:result.key,label,type:'ai',engine:result.engine,seed:seed||0,width:result.width||1024,height:result.height||1024,timestamp:Date.now(),prompt:label};
      blobToItem(item,result.blob);
      state.allItems.unshift(item);cache.saveMeta('history',state.allItems);
    })
    .catch(()=>showCardError(id,label,type,seed));
};

// ═══════════════════════════════════════════════
// SELECTION / FAV / DELETE
// ═══════════════════════════════════════════════
window.toggleSelect=function(id){state.selected.has(id)?state.selected.delete(id):state.selected.add(id);const c=$(id);if(c){c.classList.toggle('selected',state.selected.has(id));const cb=c.querySelector('.card-checkbox');if(cb)cb.textContent=state.selected.has(id)?'✓':'';}updateToolbar();};
window.selectAll=function(){state.items.forEach(i=>state.selected.add(i.id));document.querySelectorAll('.card').forEach(c=>{c.classList.add('selected');const cb=c.querySelector('.card-checkbox');if(cb)cb.textContent='✓';});updateToolbar();};
window.deselectAll=function(){state.selected.clear();document.querySelectorAll('.card').forEach(c=>{c.classList.remove('selected');const cb=c.querySelector('.card-checkbox');if(cb)cb.textContent='';});updateToolbar();};
window.toggleFav=async function(id){state.favorites.has(id)?state.favorites.delete(id):state.favorites.add(id);await cache.saveMeta('favorites',[...state.favorites]);const c=$(id);if(c){const b=c.querySelector('.card-btn-fav');if(b)b.textContent=state.favorites.has(id)?'★':'☆';}toast(state.favorites.has(id)?'⭐ اضافه شد':'حذف شد','info');};
window.deleteItem=function(id){
  const idx=state.items.findIndex(i=>i.id===id);
  if(idx>=0){revokeBlob(state.items[idx].src);state.items.splice(idx,1);}
  const ai=state.allItems.findIndex(i=>i.id===id);if(ai>=0)state.allItems.splice(ai,1);
  state.selected.delete(id);state.favorites.delete(id);
  const c=$(id);if(c)c.remove();
  cache.saveMeta('history',state.allItems);cache.saveMeta('favorites',[...state.favorites]);
  updateToolbar();toast('حذف شد','info');
};
window.deleteSelected=function(){[...state.selected].forEach(id=>deleteItem(id));state.selected.clear();updateToolbar();};

// ═══════════════════════════════════════════════
// DOWNLOAD
// ═══════════════════════════════════════════════
window.quickDownload=function(id){
  const item=state.items.find(i=>i.id===id)||state.allItems.find(i=>i.id===id);
  if(!item||!item.src)return;
  const a=document.createElement('a');
  a.href=item.src;
  a.download=`ai-${item.width||1024}x${item.height||1024}-${Date.now()}.png`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  toast('💾 دانلود شروع شد','success');
};
window.downloadSelected=async function(){
  if(state.selected.size===0){toast('انتخاب کنید','error');return;}
  for(const id of[...state.selected]){quickDownload(id);await new Promise(r=>setTimeout(r,400));}
  toast('دانلود گروهی انجام شد','success');
};

// ═══════════════════════════════════════════════
// MODAL
// ═══════════════════════════════════════════════
window.openModal=function(item){
  currentModalItem=item;
  $('modalImg').src=item.src;
  $('modalQuality').textContent=`📐 ${item.width||'?'}×${item.height||'?'} · ${engineName(item.engine||'online')} · Seed: ${item.seed||'-'}`;
  $('modalDesc').textContent=`${item.label}\n${item.prompt&&item.prompt!==item.label?'Prompt: '+item.prompt:''}`;
  modal.classList.add('open');
};
window.closeModal=function(){modal.classList.remove('open');currentModalItem=null;};
window.downloadModal=function(){if(currentModalItem)quickDownload(currentModalItem.id);};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
modal.addEventListener('click',e=>{if(e.target===modal)closeModal();});

// ═══════════════════════════════════════════════
// RENDER GALLERY
// ═══════════════════════════════════════════════
function renderGallery(items){
  state.items.forEach(i=>revokeBlob(i.src));
  state.items=[];gallery.innerHTML='';state.selected.clear();updateToolbar();
  if(!items||items.length===0)return;
  items.forEach(item=>{
    createLoadingCard(item.id,item.label,item.type==='ddg'?'ddg':'ai');
    (async()=>{
      if(item.blob)return blobToItem(item,item.blob);
      const cached=await cache.get(item.cacheKey);
      if(cached)return blobToItem(item,cached);
      const signal=new AbortController().signal;
      if(item.engine==='proc'||item.type!=='ai'){
        if(item.engine==='proc'){const r=await genProc(item.prompt||item.label,item.seed);return blobToItem(item,r.blob);}
        const r=await fetch(item.cacheKey,{signal});const b=await r.blob();return blobToItem(item,b);
      }
      const r=await generateImage(item.prompt||item.label,item.width||1024,item.height||1024,item.seed||1,signal,null);
      item.cacheKey=r.key;item.engine=r.engine;
      blobToItem(item,r.blob);
    })().catch(()=>showCardError(item.id,item.label,item.type,item.seed));
  });
}

// Drag & Drop
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{
  e.preventDefault();
  const files=[...e.dataTransfer.files].filter(f=>f.type.startsWith('image/'));
  if(!files.length)return;
  files.forEach(f=>{
    const url=URL.createObjectURL(f);
    const id=`up-${Date.now()}-${Math.random().toString(36).slice(2,7)}`;
    const img=new Image();
    img.onload=()=>{
      const item={id,src:url,cacheKey:url,label:f.name,type:'upload',engine:'online',seed:0,width:img.naturalWidth,height:img.naturalHeight,timestamp:Date.now(),prompt:f.name};
      state.items.unshift(item);replaceCardWithImage(item);
    };
    img.src=url;
  });
  toast(`${files.length} آپلود شد`,'success');
});

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
(async function init(){
  await cache.init();
  const favs=await cache.getMeta('favorites');if(Array.isArray(favs))state.favorites=new Set(favs);
  const hist=await cache.getMeta('history');if(Array.isArray(hist))state.allItems=hist;

  if(navigator.onLine){$('netDot').className='status-dot dot-live';$('netStatus').textContent='آنلاین';}
  else{$('netDot').className='status-dot dot-dead';$('netStatus').textContent='آفلاین → موتور داخلی/آفلاین';}
  window.addEventListener('online',()=>{$('netDot').className='status-dot dot-live';$('netStatus').textContent='آنلاین';});
  window.addEventListener('offline',()=>{$('netDot').className='status-dot dot-dead';$('netStatus').textContent='آفلاین';});

  // Auto-detect blocked network
  (async()=>{
    try{
      const r=await fetch('https://image.pollinations.ai/prompt/test?width=64&height=64&seed=1&nologo=true',{signal:AbortSignal.timeout(5000)});
      if(!r.ok)throw 0;
      $('engineSelect').value='auto';
    }catch(e){
      $('netDot').className='status-dot dot-dead';
      $('netStatus').textContent='آنلاین مسدود → AI داخلی خودکار';
      if($('engineSelect').value==='online')$('engineSelect').value='local';
      toast('سرویس آنلاین مسدود است؛ موتور «AI داخلی» بدون فیلترشکن فعال شد','info');
    }
  })();

  // Welcome images
  const welcomes=[
    {p:'Persian garden at golden hour with fountain and roses',s:4829173},
    {p:'Snow leopard on mountain peak, wildlife photography',s:7361924},
    {p:'Cyberpunk city street at night with neon rain',s:5817364},
    {p:'Bioluminescent jellyfish in deep ocean',s:2948165}
  ];
  welcomes.forEach((w,i)=>{
    const id=`init-${i}-${w.s}`;
    createLoadingCard(id,w.p,'ai');
    enqueue(()=>generateImage(w.p,1024,1024,w.s,new AbortController().signal,msg=>{const el=$(id)?.querySelector('.load-text');if(el)el.textContent=msg;}))
      .then(r=>{
        const item={id,cacheKey:r.key,label:w.p,type:'ai',engine:r.engine,seed:w.s,width:r.width||1024,height:r.height||1024,timestamp:Date.now(),prompt:w.p};
        blobToItem(item,r.blob);state.allItems.unshift(item);cache.saveMeta('history',state.allItems);
      })
      .catch(()=>showCardError(id,w.p,'ai',w.s));
  });
})();
</script>
</body>
